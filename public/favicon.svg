<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3b82f6" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Rounded Background -->
  <rect width="64" height="64" rx="16" fill="url(#grad)" filter="url(#glow)" />
  <!-- Border highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.5" />
  <!-- TD Text Monogram -->
  <text x="32" y="41" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">TD</text>
</svg>
